[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "retrieval"
version = "0.1.0"
description = "RAG retrieval pipeline for medical/hypertension guidelines"
requires-python = ">=3.10"
dependencies = [
    "sentence-transformers>=3.0.0",
    "chromadb>=0.5.0",
    "rank_bm25>=0.2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
retrieval-build = "cli.build_index:build_index"
retrieval-query = "cli.query_cli:_parse_args"

[tool.setuptools.packages.find]
include = ["retrieval*", "cli*"]

[tool.pytest.ini_options]
markers = [
    "integration: slow tests that download and run real models (deselect with '-m \"not integration\"')",
]
addopts = "-m \"not integration\""
testpaths = ["tests"]
