services:

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: medical_rag
    ports:
      - "5433:5432"
    volumes:
      - medical-postgres-data:/var/lib/postgresql/data
    networks:
      - app-net
    restart: unless-stopped

networks:
  app-net:

volumes:
  medical-postgres-data: